<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>AeroPack &mdash; Live Check-In Scoreboard</title>
<style>
  /* ---------- Design tokens (Aeropay brand) ---------- */
  :root{
    --aqua-bright: #0FDDF0;
    --aqua-deep: #0B6E80;
    --aqua-tint: #EAFBFD;
    --white: #FFFFFF;
    --ink: #0B4A57;
    --ink-muted: #4C8A95;
    --shadow-sm: 0 1px 3px rgba(11,110,128,0.08);
    --shadow-md: 0 6px 20px rgba(11,110,128,0.10);
    --shadow-lg: 0 10px 30px rgba(11,110,128,0.14);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
    overscroll-behavior: none;
  }

  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    background: var(--white);
    color: var(--ink);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #app{
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: clamp(10px, 1.6vh, 20px) clamp(12px, 2vw, 26px);
    gap: clamp(8px, 1.4vh, 16px);
  }

  /* ---------- Top bar ---------- */
  .topbar{
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    background: var(--aqua-tint);
    border-radius: var(--radius-lg);
    padding: clamp(10px, 1.6vh, 18px) clamp(16px, 2vw, 26px);
    box-shadow: var(--shadow-md);
  }

  .brand{
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .brand-icon{
    flex: 0 0 auto;
    height: clamp(26px, 2.9vh, 34px);
    width: auto;
    aspect-ratio: 95.07 / 68.22;
  }

  .brand-text h1{
    margin: 0;
    font-size: clamp(1.05rem, 1.9vh + 0.4rem, 1.5rem);
    letter-spacing: -0.01em;
    font-weight: 800;
    color: var(--aqua-deep);
    white-space: nowrap;
  }

  .brand-text p{
    margin: 2px 0 0;
    font-size: clamp(0.68rem, 1vh + 0.2rem, 0.85rem);
    color: var(--ink-muted);
    font-weight: 500;
    white-space: nowrap;
  }

  .stats{
    display: flex;
    align-items: center;
    gap: clamp(14px, 2vw, 30px);
    flex: 1 1 auto;
    justify-content: flex-end;
    min-width: 0;
  }

  .total-block{
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.05;
  }

  .total-label{
    font-size: clamp(0.62rem, 0.8vh + 0.2rem, 0.75rem);
    text-transform: uppercase;
    letter-spacing: 0.09em;
    font-weight: 700;
    color: var(--ink-muted);
  }

  .total-number{
    font-size: clamp(1.7rem, 3.6vh + 0.4rem, 2.6rem);
    font-weight: 800;
    color: var(--aqua-deep);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .progress-track{
    position: relative;
    height: 10px;
    border-radius: 999px;
    background: rgba(11,110,128,0.10);
    overflow: hidden;
  }

  .progress-fill{
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--aqua-bright), var(--aqua-deep));
    transition: width 600ms cubic-bezier(.22,.8,.28,1);
  }

  .progress-fill.goal-hit{
    animation: goalShimmer 1.6s ease-in-out infinite;
  }

  @keyframes goalShimmer{
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.18); }
  }

  .progress-text{
    margin-top: 6px;
    font-size: clamp(0.65rem, 0.85vh + 0.2rem, 0.78rem);
    color: var(--ink-muted);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Kits (bags packed) panel — staff-controlled goal thermometer ---------- */
  .kits-panel{
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: clamp(14px, 2vw, 26px);
    background: var(--white);
    border: 1.6px solid rgba(11,110,128,0.14);
    border-radius: var(--radius-lg);
    padding: clamp(10px, 1.4vh, 16px) clamp(16px, 2vw, 24px);
    box-shadow: var(--shadow-sm);
  }

  .kits-info{
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    gap: clamp(10px, 1.4vw, 16px);
    min-width: 0;
  }

  .kits-label{
    flex: 0 0 auto;
    font-size: clamp(0.68rem, 0.9vh + 0.2rem, 0.82rem);
    font-weight: 800;
    color: var(--aqua-deep);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    white-space: nowrap;
  }

  .kits-track{
    flex: 1 1 auto;
    min-width: 60px;
    height: 12px;
  }

  .kits-text{
    flex: 0 0 auto;
    font-weight: 700;
    font-size: clamp(0.68rem, 0.9vh + 0.2rem, 0.82rem);
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .kits-controls{
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .stepper-btn{
    flex: 0 0 auto;
    width: clamp(32px, 4.2vh, 42px);
    height: clamp(32px, 4.2vh, 42px);
    border-radius: 50%;
    border: 1.6px solid rgba(11,110,128,0.25);
    background: var(--aqua-tint);
    color: var(--aqua-deep);
    font-size: 1.25rem;
    font-weight: 800;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 100ms ease, background 150ms ease;
  }
  .stepper-btn:hover{ background: #DEF5F8; }
  .stepper-btn:active{ transform: scale(0.88); }

  .kits-number{
    flex: 0 0 auto;
    min-width: 3em;
    text-align: center;
    font-size: clamp(1.2rem, 2vh + 0.4rem, 1.7rem);
    font-weight: 800;
    color: var(--aqua-deep);
    font-variant-numeric: tabular-nums;
    background: var(--aqua-tint);
    border: 1.6px dashed rgba(11,110,128,0.35);
    border-radius: var(--radius-sm);
    padding: 4px 12px;
    cursor: text;
    font-family: inherit;
  }
  .kits-number:hover{ border-color: var(--aqua-deep); }

  .kits-number.pulse{ animation: numberPop 320ms ease; }
  @keyframes numberPop{
    0%   { transform: scale(1); }
    40%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .kits-edit-input{
    flex: 0 0 auto;
    width: 4.2em;
    text-align: center;
    font-size: clamp(1.2rem, 2vh + 0.4rem, 1.7rem);
    font-weight: 800;
    color: var(--aqua-deep);
    font-variant-numeric: tabular-nums;
    background: var(--white);
    border: 1.6px solid var(--aqua-deep);
    border-radius: var(--radius-sm);
    padding: 4px 8px;
    font-family: inherit;
    outline: none;
  }

  .icon-btn{
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--white);
    border: 1.5px solid rgba(11,110,128,0.22);
    color: var(--aqua-deep);
    font-weight: 700;
    font-size: clamp(0.72rem, 0.9vh + 0.3rem, 0.86rem);
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 150ms ease, transform 100ms ease, border-color 150ms ease, opacity 150ms ease;
    white-space: nowrap;
  }

  .icon-btn svg{ width: 16px; height: 16px; }

  .icon-btn:hover:not(:disabled){ background: var(--aqua-tint); border-color: rgba(11,110,128,0.4); }
  .icon-btn:active:not(:disabled){ transform: scale(0.94); }
  .icon-btn:disabled{ opacity: 0.35; cursor: not-allowed; }

  .reset-link{
    flex: 0 0 auto;
    background: none;
    border: none;
    color: var(--ink-muted);
    font-size: clamp(0.62rem, 0.8vh + 0.2rem, 0.72rem);
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    opacity: 0.7;
    padding: 4px;
  }
  .reset-link:hover{ opacity: 1; color: var(--aqua-deep); }

  /* ---------- Main content ---------- */
  .content{
    flex: 1 1 auto;
    display: flex;
    gap: clamp(10px, 1.4vw, 20px);
    min-height: 0;
  }

  .grid-panel{
    flex: 1.55 1 0;
    min-width: 0;
    display: flex;
  }

  .team-grid{
    width: 100%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 1fr;
    gap: clamp(8px, 1.2vh, 14px);
  }

  .team-btn{
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(2px, 0.6vh, 6px);
    background: var(--white);
    border: 1.6px solid rgba(11,110,128,0.14);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    padding: 4px;
    overflow: hidden;
    transition: transform 120ms ease, box-shadow 160ms ease, border-color 160ms ease;
    -webkit-tap-highlight-color: transparent;
  }

  .team-btn:hover{ box-shadow: var(--shadow-md); border-color: rgba(11,110,128,0.24); }
  .team-btn:active{ transform: scale(0.95); }

  .team-btn.pulse{
    animation: teamPulse 480ms ease;
  }

  @keyframes teamPulse{
    0%   { box-shadow: 0 0 0 0 rgba(15,221,240,0.55); border-color: var(--aqua-bright); }
    60%  { box-shadow: 0 0 0 14px rgba(15,221,240,0); border-color: var(--aqua-bright); }
    100% { box-shadow: var(--shadow-sm); border-color: rgba(11,110,128,0.14); }
  }

  .team-icon{
    width: clamp(18px, 3vh, 28px);
    height: clamp(18px, 3vh, 28px);
    color: var(--aqua-deep);
    flex: 0 0 auto;
  }

  .team-name{
    font-weight: 700;
    font-size: clamp(0.62rem, 0.85vw + 0.35rem, 0.88rem);
    text-align: center;
    color: var(--ink);
    line-height: 1.15;
    padding: 0 2px;
  }

  .team-count{
    font-size: clamp(1.15rem, 1.8vh + 0.4rem, 1.7rem);
    font-weight: 800;
    color: var(--aqua-deep);
    font-variant-numeric: tabular-nums;
  }

  .plus-one{
    position: absolute;
    top: 10px;
    right: 12px;
    font-size: 0.85rem;
    font-weight: 800;
    color: var(--aqua-bright);
    pointer-events: none;
    animation: floatUp 700ms ease-out forwards;
  }

  @keyframes floatUp{
    0%   { opacity: 0; transform: translateY(4px) scale(0.8); }
    25%  { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-22px) scale(1); }
  }

  /* ---------- Leaderboard ---------- */
  .leaderboard-panel{
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--aqua-tint);
    border-radius: var(--radius-lg);
    padding: clamp(10px, 1.6vh, 18px) clamp(12px, 1.4vw, 18px);
    box-shadow: var(--shadow-md);
  }

  .leaderboard-panel h2{
    margin: 0 0 clamp(6px, 1vh, 10px);
    font-size: clamp(0.68rem, 0.9vh + 0.2rem, 0.8rem);
    text-transform: uppercase;
    letter-spacing: 0.09em;
    font-weight: 800;
    color: var(--aqua-deep);
    flex: 0 0 auto;
  }

  .leaderboard-list{
    list-style: none;
    margin: 0;
    padding: 0;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(4px, 0.8vh, 7px);
  }

  .lb-row{
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--white);
    border-radius: var(--radius-sm);
    padding: 0 clamp(8px, 1vw, 14px);
    box-shadow: 0 1px 2px rgba(11,110,128,0.06);
    position: relative;
  }

  .lb-rank{
    flex: 0 0 auto;
    width: clamp(20px, 2.6vh, 27px);
    height: clamp(20px, 2.6vh, 27px);
    border-radius: 50%;
    background: var(--aqua-tint);
    color: var(--aqua-deep);
    font-weight: 800;
    font-size: clamp(0.65rem, 0.9vh + 0.15rem, 0.78rem);
    display: flex;
    align-items: center;
    justify-content: center;
    font-variant-numeric: tabular-nums;
  }

  .lb-row.rank-1 .lb-rank{ background: var(--aqua-bright); color: var(--white); }
  .lb-row.rank-2 .lb-rank{ background: rgba(15,221,240,0.55); color: var(--white); }
  .lb-row.rank-3 .lb-rank{ background: rgba(15,221,240,0.32); color: var(--aqua-deep); }

  .lb-name{
    flex: 1 1 auto;
    min-width: 0;
    font-weight: 700;
    font-size: clamp(0.68rem, 0.85vw + 0.3rem, 0.86rem);
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .lb-count{
    flex: 0 0 auto;
    font-weight: 800;
    font-size: clamp(0.75rem, 0.9vw + 0.3rem, 0.94rem);
    color: var(--aqua-deep);
    font-variant-numeric: tabular-nums;
    min-width: 1.6em;
    text-align: right;
  }

  /* ---------- Confetti ---------- */
  #confettiLayer{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    overflow: hidden;
  }

  .confetti-piece{
    position: absolute;
    width: 6px;
    height: 9px;
    border-radius: 2px;
    opacity: 1;
    will-change: transform, opacity;
    animation: confettiFall var(--dur, 800ms) cubic-bezier(.15,.7,.4,1) forwards;
  }

  @keyframes confettiFall{
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx, 0px), var(--dy, 120px)) rotate(var(--rot, 360deg)); opacity: 0; }
  }

  @media (max-width: 900px){
    .team-grid{ grid-template-columns: repeat(3, 1fr); }
    .content{ flex-direction: column; }
    .leaderboard-panel{ flex: 1 1 0; }
  }
</style>
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 95.07 68.22" aria-hidden="true">
        <defs>
          <linearGradient id="aeropackLogoGradient" x1="65.93" y1="-16.14" x2="23.57" y2="57.22" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#05DBB2"/>
            <stop offset="1" stop-color="#34C1D7"/>
          </linearGradient>
        </defs>
        <path fill="url(#aeropackLogoGradient)" d="M94.6,3.17C92.87,5.78,53,59.11,48.25,65.23c-1.14,1.45-2.55,3.06-4.4,3l-.7-.11-.07,0c-2.1,0-3.64-2.8-4.56-4.3a25.65,25.65,0,0,0-5.84-7.06,11.41,11.41,0,0,0-7-2.55c-.82,0-1.65.13-2.48.1a3.49,3.49,0,0,1-2.29-.81A3,3,0,0,1,20,51.16c.15-2.36,2.53-3.47,4.26-4.6l.86-.56c.44-.29,48.54-31.39,49.13-31.86a2.27,2.27,0,0,0,.87-1.07,1.18,1.18,0,0,0-.31-1.28,1.41,1.41,0,0,0-1.38-.11,7.32,7.32,0,0,0-1.41.75c-1.18.71-48,28.07-50.69,29.51a9.87,9.87,0,0,1-1,.43,4.27,4.27,0,0,1-2.12.24c-.94-.17-1.31-.78-1.86-1.45A22.94,22.94,0,0,0,6,33.7a33.23,33.23,0,0,1-4.44-1.63A2.65,2.65,0,0,1,0,29.75a2.52,2.52,0,0,1,.43-1.41,2.53,2.53,0,0,1,1.05-.81A40.83,40.83,0,0,1,5.9,25.81c.69-.25,1.37-.47,2.05-.7l1-.34c.34-.12.67-.27,1-.36l3.9-1.32C17.19,22,92.32-.16,93.54,0,95.29.23,95.39,2,94.6,3.17Z"/>
      </svg>
      <div class="brand-text">
        <h1>AeroPack</h1>
        <p>Live check-in scoreboard &middot; Aeropay</p>
      </div>
    </div>

    <div class="stats">
      <div class="total-block">
        <span class="total-label">People checked in</span>
        <span class="total-number" id="totalNumber" data-current="0">0</span>
      </div>

      <button class="icon-btn" id="undoBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10h10a5 5 0 010 10H8"/>
          <path d="M8 5L3 10l5 5"/>
        </svg>
        Undo last check-in
      </button>

      <button class="reset-link" id="resetBtn">Reset</button>
    </div>
  </header>

  <section class="kits-panel">
    <div class="kits-info">
      <span class="kits-label">Bags packed</span>
      <div class="progress-track kits-track">
        <div class="progress-fill" id="kitsProgressFill"></div>
      </div>
      <span class="kits-text" id="kitsProgressText">0 / 100</span>
    </div>
    <div class="kits-controls">
      <button class="stepper-btn" id="bagMinusBtn" type="button" aria-label="Remove one bag">&minus;</button>
      <button class="kits-number" id="kitsNumber" type="button" data-current="0" title="Tap to type an exact count">0</button>
      <button class="stepper-btn" id="bagPlusBtn" type="button" aria-label="Add one bag">+</button>
    </div>
  </section>

  <main class="content">
    <section class="grid-panel">
      <div class="team-grid" id="teamGrid"></div>
    </section>

    <aside class="leaderboard-panel">
      <h2>Leaderboard</h2>
      <ol class="leaderboard-list" id="leaderboardList"></ol>
    </aside>
  </main>

</div>

<div id="confettiLayer"></div>

<script>
(function () {
  "use strict";

  /* =========================================================
     Configuration
     ========================================================= */

  var GOAL = 100;
  var STORAGE_KEY = "aeropack-scoreboard-v2";

  // Minimal stroke-style line icons (24x24), one per team.
  var ICONS = {
    finance: '<path d="M4 20V10M12 20V4M20 20v-7"/>',
    marketing: '<path d="M3 10v4h3l5 4V6l-5 4H3z"/><path d="M16 9a4 4 0 010 6"/><path d="M19 6a8 8 0 010 12"/>',
    product: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5"/><path d="M12 12v9"/>',
    engineering: '<path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 005.4-5.4l-2.5 2.5-2-2 2.5-2.5z"/>',
    paymentOps: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/>',
    partnerships: '<circle cx="8.5" cy="12" r="4.5"/><circle cx="15.5" cy="12" r="4.5"/>',
    revenue: '<path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/>',
    customerSuccess: '<path d="M21 11.5a8.4 8.4 0 01-8.5 8.5 8.4 8.4 0 01-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 01-.9-3.8A8.4 8.4 0 0112.5 3a8.4 8.4 0 018.5 8.5z"/><path d="M8.5 12.5l2 2 4.5-4.5"/>',
    people: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.3"/><path d="M15.8 14.1a5 5 0 014.7 4.9"/>',
    risk: '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/>',
    revenueOps: '<path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/>',
    solutions: '<path d="M8 6l-5 6 5 6"/><path d="M16 6l5 6-5 6"/>'
  };

  var TEAMS = [
    { id: "finance", name: "Finance", icon: "finance" },
    { id: "marketing", name: "Marketing", icon: "marketing" },
    { id: "product", name: "Product", icon: "product" },
    { id: "engineering", name: "Engineering", icon: "engineering" },
    { id: "payment-ops", name: "Payment Ops", icon: "paymentOps" },
    { id: "partnerships", name: "Partnerships", icon: "partnerships" },
    { id: "revenue", name: "Revenue", icon: "revenue" },
    { id: "customer-success", name: "Customer Success", icon: "customerSuccess" },
    { id: "people-bizops", name: "People & Business Ops", icon: "people" },
    { id: "risk-compliance", name: "Risk & Compliance", icon: "risk" },
    { id: "revenue-ops", name: "Revenue Ops", icon: "revenueOps" },
    { id: "solutions-engineering", name: "Solutions Engineering", icon: "solutions" }
  ];

  var CONFETTI_COLORS = ["#0FDDF0", "#0B6E80", "#7FEAF3", "#FFFFFF"];

  /* =========================================================
     Persistence (localStorage, falls back to in-memory)
     ========================================================= */

  var hasLocalStorage = (function () {
    try {
      var k = "__aeropack_test__";
      window.localStorage.setItem(k, "1");
      window.localStorage.removeItem(k);
      return true;
    } catch (e) {
      return false;
    }
  })();

  var memoryState = null;

  function defaultState() {
    var counts = {};
    TEAMS.forEach(function (t) { counts[t.id] = 0; });
    return { counts: counts, history: [], bags: 0 };
  }

  function loadState() {
    var fallback = defaultState();
    if (!hasLocalStorage) return memoryState || fallback;
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return fallback;
      var parsed = JSON.parse(raw);
      var counts = fallback.counts;
      if (parsed && parsed.counts) {
        TEAMS.forEach(function (t) {
          if (typeof parsed.counts[t.id] === "number") counts[t.id] = parsed.counts[t.id];
        });
      }
      var history = Array.isArray(parsed && parsed.history) ? parsed.history : [];
      var bags = (parsed && typeof parsed.bags === "number") ? parsed.bags : 0;
      return { counts: counts, history: history, bags: bags };
    } catch (e) {
      return fallback;
    }
  }

  function saveState() {
    memoryState = state;
    if (!hasLocalStorage) return;
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      /* storage unavailable mid-session (e.g. quota) — keep running in memory */
    }
  }

  var state = loadState();

  /* =========================================================
     DOM references
     ========================================================= */

  var teamGrid = document.getElementById("teamGrid");
  var leaderboardList = document.getElementById("leaderboardList");
  var totalNumberEl = document.getElementById("totalNumber");
  var kitsProgressFillEl = document.getElementById("kitsProgressFill");
  var kitsProgressTextEl = document.getElementById("kitsProgressText");
  var kitsNumberBtn = document.getElementById("kitsNumber");
  var bagPlusBtn = document.getElementById("bagPlusBtn");
  var bagMinusBtn = document.getElementById("bagMinusBtn");
  var undoBtn = document.getElementById("undoBtn");
  var resetBtn = document.getElementById("resetBtn");
  var confettiLayer = document.getElementById("confettiLayer");

  var teamButtonEls = {};   // teamId -> button element
  var teamCountEls = {};    // teamId -> count span inside button
  var lbRowEls = {};        // teamId -> leaderboard row element

  /* =========================================================
     Build the tappable team grid
     ========================================================= */

  TEAMS.forEach(function (team) {
    var btn = document.createElement("button");
    btn.className = "team-btn";
    btn.type = "button";
    btn.dataset.team = team.id;
    btn.setAttribute("aria-label", "Check in " + team.name);

    btn.innerHTML =
      '<svg class="team-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
        ICONS[team.icon] +
      '</svg>' +
      '<span class="team-name">' + team.name + '</span>' +
      '<span class="team-count" data-current="0">0</span>';

    btn.addEventListener("click", function () { handleTap(team.id, btn); });

    teamGrid.appendChild(btn);
    teamButtonEls[team.id] = btn;
    teamCountEls[team.id] = btn.querySelector(".team-count");
  });

  /* =========================================================
     Build the leaderboard (initial order reflects loaded state)
     ========================================================= */

  function sortedTeamIds() {
    return TEAMS
      .map(function (t) { return t.id; })
      .sort(function (a, b) { return (state.counts[b] || 0) - (state.counts[a] || 0); });
  }

  function teamById(id) {
    for (var i = 0; i < TEAMS.length; i++) if (TEAMS[i].id === id) return TEAMS[i];
    return null;
  }

  sortedTeamIds().forEach(function (teamId) {
    var team = teamById(teamId);
    var row = document.createElement("li");
    row.className = "lb-row";
    row.dataset.team = teamId;
    row.innerHTML =
      '<span class="lb-rank">1</span>' +
      '<span class="lb-name">' + team.name + '</span>' +
      '<span class="lb-count" data-current="0">0</span>';
    leaderboardList.appendChild(row);
    lbRowEls[teamId] = row;
  });

  /* =========================================================
     Rendering helpers
     ========================================================= */

  function animateNumber(el, to) {
    var from = parseInt(el.dataset.current || "0", 10);
    if (from === to) { el.textContent = to; return; }
    el.dataset.current = String(to);

    var duration = 320;
    var start = null;

    function step(ts) {
      if (start === null) start = ts;
      var progress = Math.min(1, (ts - start) / duration);
      var eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic
      var value = Math.round(from + (to - from) * eased);
      el.textContent = value;
      if (progress < 1) {
        requestAnimationFrame(step);
      } else {
        el.textContent = to;
      }
    }
    requestAnimationFrame(step);
  }

  function totalCount() {
    var sum = 0;
    TEAMS.forEach(function (t) { sum += state.counts[t.id] || 0; });
    return sum;
  }

  function updateTeamButton(teamId) {
    animateNumber(teamCountEls[teamId], state.counts[teamId] || 0);
  }

  // "People checked in" — the sum of every team's check-in count, used purely
  // as a headline stat. The leaderboard itself is driven by the per-team
  // counts directly (see updateLeaderboard).
  function updateCheckedInTotal() {
    animateNumber(totalNumberEl, totalCount());
  }

  // "Bags packed" — a separate, staff-controlled counter (not 1:1 with
  // check-ins, since one person can pack several bags). Drives the goal
  // thermometer toward GOAL.
  function updateKitsProgress() {
    var bags = state.bags || 0;
    animateNumber(kitsNumberBtn, bags);

    var pct = Math.min(100, (bags / GOAL) * 100);
    kitsProgressFillEl.style.width = pct + "%";
    kitsProgressTextEl.textContent = Math.min(bags, GOAL) + " / " + GOAL + (bags >= GOAL ? " — goal reached!" : "");
    kitsProgressFillEl.classList.toggle("goal-hit", bags >= GOAL);
  }

  function updateUndoState() {
    undoBtn.disabled = state.history.length === 0;
  }

  // FLIP animation: reorders leaderboard rows to match current counts
  // while smoothly animating from their previous screen position.
  function updateLeaderboard() {
    var rows = Array.prototype.slice.call(leaderboardList.children);
    var firstRects = {};
    rows.forEach(function (row) {
      firstRects[row.dataset.team] = row.getBoundingClientRect();
    });

    var order = sortedTeamIds();
    order.forEach(function (teamId, index) {
      var row = lbRowEls[teamId];
      leaderboardList.appendChild(row); // moves to correct position, in order
      row.classList.remove("rank-1", "rank-2", "rank-3");
      if (index === 0) row.classList.add("rank-1");
      else if (index === 1) row.classList.add("rank-2");
      else if (index === 2) row.classList.add("rank-3");
      row.querySelector(".lb-rank").textContent = index + 1;
      animateNumber(row.querySelector(".lb-count"), state.counts[teamId] || 0);
    });

    order.forEach(function (teamId) {
      var row = lbRowEls[teamId];
      var first = firstRects[teamId];
      var last = row.getBoundingClientRect();
      var dy = first.top - last.top;
      if (dy) {
        row.style.transition = "none";
        row.style.transform = "translateY(" + dy + "px)";
        requestAnimationFrame(function () {
          row.style.transition = "transform 420ms cubic-bezier(.22,.8,.28,1)";
          row.style.transform = "";
        });
      }
    });
  }

  function pulseButton(btn, duration) {
    duration = duration || 480;
    btn.classList.remove("pulse");
    void btn.offsetWidth; // restart animation
    btn.classList.add("pulse");
    setTimeout(function () { btn.classList.remove("pulse"); }, duration);
  }

  function spawnPlusOne(btn) {
    var span = document.createElement("span");
    span.className = "plus-one";
    span.textContent = "+1";
    btn.appendChild(span);
    setTimeout(function () { span.remove(); }, 720);
  }

  function burstConfetti(btn) {
    var rect = btn.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height * 0.35;
    var count = 16;

    for (var i = 0; i < count; i++) {
      var piece = document.createElement("div");
      piece.className = "confetti-piece";

      var angle = (Math.random() * Math.PI) + Math.PI; // spread upward-ish
      var distance = 40 + Math.random() * 70;
      var dx = Math.cos(angle) * distance;
      var dy = Math.abs(Math.sin(angle) * distance) + 40 + Math.random() * 40;
      var rot = 180 + Math.random() * 360;
      var dur = 600 + Math.random() * 400;

      piece.style.left = cx + "px";
      piece.style.top = cy + "px";
      piece.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
      piece.style.setProperty("--dx", dx + "px");
      piece.style.setProperty("--dy", dy + "px");
      piece.style.setProperty("--rot", rot + "deg");
      piece.style.setProperty("--dur", dur + "ms");

      confettiLayer.appendChild(piece);
      (function (el, life) {
        setTimeout(function () { el.remove(); }, life + 50);
      })(piece, dur);
    }
  }

  /* =========================================================
     Actions
     ========================================================= */

  function handleTap(teamId, btn) {
    state.counts[teamId] = (state.counts[teamId] || 0) + 1;
    state.history.push(teamId);
    saveState();

    updateTeamButton(teamId);
    updateCheckedInTotal();
    updateLeaderboard();
    updateUndoState();

    pulseButton(btn);
    spawnPlusOne(btn);
    burstConfetti(btn);
  }

  function handleUndo() {
    if (state.history.length === 0) return;
    var teamId = state.history.pop();
    state.counts[teamId] = Math.max(0, (state.counts[teamId] || 0) - 1);
    saveState();

    updateTeamButton(teamId);
    updateCheckedInTotal();
    updateLeaderboard();
    updateUndoState();
  }

  function handleReset() {
    var ok = window.confirm("Reset the scoreboard? This clears every team's check-ins and the bags-packed count.");
    if (!ok) return;

    TEAMS.forEach(function (t) { state.counts[t.id] = 0; });
    state.history = [];
    state.bags = 0;
    saveState();

    TEAMS.forEach(function (t) { updateTeamButton(t.id); });
    updateCheckedInTotal();
    updateLeaderboard();
    updateUndoState();
    updateKitsProgress();
  }

  // Bags packed — staff control, independent of the check-in leaderboard.
  function handleBagIncrement() {
    state.bags = (state.bags || 0) + 1;
    saveState();
    updateKitsProgress();
    pulseButton(kitsNumberBtn, 320);
  }

  function handleBagDecrement() {
    state.bags = Math.max(0, (state.bags || 0) - 1);
    saveState();
    updateKitsProgress();
    pulseButton(kitsNumberBtn, 320);
  }

  function startEditingBags() {
    var current = state.bags || 0;
    var input = document.createElement("input");
    input.type = "number";
    input.min = "0";
    input.inputmode = "numeric";
    input.className = "kits-edit-input";
    input.value = current;

    kitsNumberBtn.replaceWith(input);
    input.focus();
    input.select();

    var committed = false;
    function commit() {
      if (committed) return;
      committed = true;
      var val = parseInt(input.value, 10);
      if (isNaN(val) || val < 0) val = 0;
      state.bags = val;
      saveState();
      input.replaceWith(kitsNumberBtn);
      updateKitsProgress();
    }

    input.addEventListener("blur", commit);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") input.blur();
      if (e.key === "Escape") { input.value = current; input.blur(); }
    });
  }

  undoBtn.addEventListener("click", handleUndo);
  resetBtn.addEventListener("click", handleReset);
  bagPlusBtn.addEventListener("click", handleBagIncrement);
  bagMinusBtn.addEventListener("click", handleBagDecrement);
  kitsNumberBtn.addEventListener("click", startEditingBags);

  /* =========================================================
     Initial paint
     ========================================================= */

  TEAMS.forEach(function (t) {
    teamCountEls[t.id].textContent = state.counts[t.id] || 0;
    teamCountEls[t.id].dataset.current = String(state.counts[t.id] || 0);
  });
  sortedTeamIds().forEach(function (teamId, index) {
    var row = lbRowEls[teamId];
    row.querySelector(".lb-rank").textContent = index + 1;
    if (index === 0) row.classList.add("rank-1");
    else if (index === 1) row.classList.add("rank-2");
    else if (index === 2) row.classList.add("rank-3");
    var countEl = row.querySelector(".lb-count");
    countEl.textContent = state.counts[teamId] || 0;
    countEl.dataset.current = String(state.counts[teamId] || 0);
  });

  totalNumberEl.textContent = totalCount();
  totalNumberEl.dataset.current = String(totalCount());
  updateCheckedInTotal();
  updateUndoState();

  kitsNumberBtn.textContent = state.bags || 0;
  kitsNumberBtn.dataset.current = String(state.bags || 0);
  updateKitsProgress();

})();
</script>

</body>
</html>
